<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Socket - Crear cuenta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-header">
            <div class="logo">💬</div>
            <h1>Crear cuenta</h1>
            <p>Regístrate para usar el chat</p>
        </div>

        {% if error %}
        <div class="aviso aviso-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('registro') }}">

            <input type="hidden" name="csrf" value="{{ csrf_token() }}">

            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario"
                       placeholder="3 a 20 caracteres (letras, números o _)"
                       value="{{ usuario or '' }}"
                       minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
                       autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="Mínimo 6 caracteres"
                       minlength="6" maxlength="128"
                       autocomplete="new-password" required>
            </div>

            <div class="input-group">
                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar"
                       placeholder="Repite tu contraseña"
                       minlength="6" maxlength="128"
                       autocomplete="new-password" required>
            </div>

            <button type="submit" class="login-button">Crear cuenta</button>

        </form>

        <p class="enlace">
            ¿Ya tienes cuenta?
            <a href="{{ url_for('login') }}">Inicia sesión</a>
        </p>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Socket - Iniciar sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-header">
            <div class="logo">💬</div>
            <h1>Chat Socket</h1>
            <p>Comunicación en tiempo real</p>
        </div>

        {% if exito %}
        <div class="aviso aviso-ok">Cuenta creada. Ya puedes iniciar sesión.</div>
        {% endif %}

        {% if error %}
        <div class="aviso aviso-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">

            <input type="hidden" name="csrf" value="{{ csrf_token() }}">

            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario"
                       placeholder="Ingresa tu usuario"
                       value="{{ usuario or '' }}"
                       maxlength="20" autocomplete="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="Ingresa tu contraseña"
                       maxlength="128" autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-button">Iniciar Sesión</button>

        </form>

        <p class="enlace">
            ¿No tienes cuenta?
            <a href="{{ url_for('registro') }}">Regístrate</a>
        </p>

        <div class="login-footer">
            <p>Chat Socket v2.0</p>
            <span>Sistema de comunicación en tiempo real</span>
        </div>

    </div>

</body>

</html>
